name: Build and deploy

# Pull requests only get checked; main gets checked and deployed.
# Needs Settings → Pages → Source set to "GitHub Actions".
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Only reading by default, so the build (which runs every dependency's install script) can't touch the site.
permissions:
  contents: read

# A newer push to a pull request stops checking the old one. Deployments always finish, so the site is never
# left half-deployed; a newer one waits its turn.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the token isn't left in the git config for later steps.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
